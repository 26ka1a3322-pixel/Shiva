<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nakshatra – Your Bright Future</title>
<meta name="theme-color" content="#14123a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--night:#14123a;--deep:#1f1b55;--gold:#f2b134;--rose:#e8647c;--lotus:#fbf3e4;--mist:#b9b4e0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--lotus);font-family:Georgia,"Times New Roman",serif;line-height:1.55;min-height:100vh;
background-image:radial-gradient(circle at 80% -10%,#3a2f8f 0,transparent 45%)}
main{max-width:520px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:2.1rem;margin:8px 0 4px;color:var(--gold);letter-spacing:.5px}
.sub{color:var(--mist);margin:0 0 24px}
form{background:var(--deep);padding:20px;border-radius:18px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.95rem;color:var(--mist)}
input,select{font:inherit;padding:12px;border-radius:10px;border:1.5px solid #4a448f;background:#15123f;color:var(--lotus)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:bold;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#2a1f00;cursor:pointer}
#install{margin-top:12px;background:transparent;border:1.5px solid var(--gold);color:var(--gold);display:none;width:100%}
#result{margin-top:26px;display:none}
.sign{font-size:1.6rem;color:var(--gold);margin:0}
.card{background:var(--deep);border-radius:16px;padding:16px 18px;margin:14px 0}
.card h3{margin:0 0 6px;font-size:1rem;color:var(--rose)}
.lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lucky div{background:var(--deep);border-radius:14px;padding:14px 8px;text-align:center}
.lucky b{display:block;font-size:1.25rem;color:var(--gold);margin-top:4px}
.lucky small{color:var(--mist)}
.swatch{width:34px;height:34px;border-radius:50%;margin:0 auto 4px;border:2px solid var(--lotus)}
.note{font-size:.8rem;color:var(--mist);margin-top:22px}
@media (prefers-reduced-motion:no-preference){#result.show{animation:rise .5s ease}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main>
  <h1>Nakshatra</h1>
  <p class="sub">Enter your birth details and see your bright future.</p>

  <form id="f">
    <label>Your name <input id="name" required maxlength="40" autocomplete="name"></label>
    <div class="row">
      <label>Date of birth <input id="dob" type="date" required></label>
      <label>Birth time <input id="tob" type="time" required></label>
    </div>
    <label>Your mood today
      <select id="mood">
        <option value="happy">Happy</option>
        <option value="calm">Calm</option>
        <option value="stressed">Stressed</option>
        <option value="energetic">Energetic</option>
        <option value="romantic">Romantic</option>
        <option value="curious">Curious</option>
      </select>
    </label>
    <button type="submit">Show my future</button>
  </form>
  <button id="install" type="button">Install this app</button>

  <section id="result" aria-live="polite">
    <p class="sign" id="rSign"></p>
    <p id="rHello"></p>
    <div class="lucky">
      <div><small>Lucky number</small><b id="rNum"></b></div>
      <div><small>Lucky colour</small><span class="swatch" id="rSw"></span><b id="rCol"></b></div>
      <div><small>Lucky place</small><b id="rPlace"></b></div>
    </div>
    <div class="card"><h3>Your future</h3><div id="rFuture"></div></div>
    <div class="card"><h3>Career &amp; money</h3><div id="rCareer"></div></div>
    <div class="card"><h3>Love &amp; family</h3><div id="rLove"></div></div>
    <div class="card"><h3>Today's advice for your mood</h3><div id="rMood"></div></div>
  </section>

  <p class="note">For entertainment only. Sun sign comes from your date of birth; birth time shapes the time-of-day energy in your reading.</p>
</main>

<script>
const SIGNS=[ // name, start month/day, element, strengths
["Capricorn",12,22,"earth","discipline and patience"],
["Aquarius",1,20,"air","original ideas"],
["Pisces",2,19,"water","intuition and kindness"],
["Aries",3,21,"fire","courage and a fresh start"],
["Taurus",4,20,"earth","steady effort"],
["Gemini",5,21,"air","clever communication"],
["Cancer",6,21,"water","caring and loyalty"],
["Leo",7,23,"fire","confidence and leadership"],
["Virgo",8,23,"earth","skill and attention to detail"],
["Libra",9,23,"air","balance and charm"],
["Scorpio",10,23,"water","focus and inner strength"],
["Sagittarius",11,22,"fire","hope and big vision"]];

const COLOURS={
fire:[["Gold","#f2b134"],["Saffron","#ff8a1f"],["Ruby red","#d62b4b"]],
earth:[["Emerald green","#1f9d6b"],["Sandal beige","#d8b98a"],["Olive","#7a8c3a"]],
air:[["Sky blue","#5bb5ec"],["Lavender","#a48be0"],["Pearl white","#f3efe6"]],
water:[["Sea teal","#16a3a3"],["Silver","#c4c9d4"],["Ocean blue","#2f6fdb"]]};

const PLACES={
happy:["a beach at sunset","a lively festival ground","a family garden"],
calm:["a quiet temple","a lake shore","a hill-top viewpoint"],
stressed:["a green forest walk","a river bank","a peaceful library"],
energetic:["a hiking trail","a sports ground","a hilltop fort"],
romantic:["a rose garden","a boat ride on a lake","a moonlit terrace"],
curious:["a museum","an old heritage town","a book market"]};

const MOOD_ADVICE={
happy:"Your happy mood attracts good people. Share your good news today; it will multiply.",
calm:"Calm is your superpower now. Decisions made quietly today will turn out well.",
stressed:"This pressure is short. Take a slow walk, drink water, and do one small task. Relief is coming.",
energetic:"Your energy is high. Start the thing you have been postponing; momentum is on your side.",
romantic:"Hearts are open for you today. Say the kind words you usually keep inside.",
curious:"Your curiosity will open a door. Learn something new today; it will help you soon."};

const TIME_ENERGY=h=>h<5?["night owl","deep thinking and creativity"]:h<8?["sunrise","fresh leadership and luck"]:h<12?["morning","hard work that pays back"]:h<16?["afternoon","strong social skills and money sense"]:h<20?["evening","warm relationships and wisdom"]:["night","imagination and spiritual strength"];

const FUTURE=[
"The coming months bring a pleasant turning point; something you worked for starts to show results.",
"A helpful person will enter your life soon and make a difficult path easier.",
"Good news about money, studies or work is on its way within this season.",
"Your confidence grows steadily and others will begin to trust your decisions.",
"A journey or a change of place brings you new opportunity and happiness."];
const CAREER=[
"Your efforts get noticed. A promotion, a new project or a better income is possible this year.",
"A new skill you learn now will become a strong source of income later.",
"Savings made with patience will grow; avoid hurry and you will prosper.",
"Teamwork brings success. A partnership gives you a clear benefit."];
const LOVE=[
"Family bonds become stronger and a happy gathering is near.",
"Someone special thinks of you warmly. Open and honest talk will bring you closer.",
"Old misunderstandings fade away and peace returns at home.",
"Friends bring joy; one friendship turns into real support."];

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(r,arr){return arr[Math.floor(r()*arr.length)]}
function reduce(n){while(n>9&&n!==11&&n!==22){n=String(n).split("").reduce((a,b)=>a+ +b,0)}return n}
function sunSign(m,d){let s=SIGNS[0];for(const x of SIGNS){if(m>x[1]||(m===x[1]&&d>=x[2]))s=x}
  if(m===1&&d<20)return SIGNS[0];return s}

document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  const dob=document.getElementById("dob").value;
  const tob=document.getElementById("tob").value;
  const mood=document.getElementById("mood").value;
  const [y,m,d]=dob.split("-").map(Number);
  const hour=parseInt(tob.split(":")[0],10);

  const [sign,,,el,strength]=sunSign(m,d);
  const [slot,slotGift]=TIME_ENERGY(hour);
  const r=rng(hash(name.toLowerCase()+dob+tob+mood));

  const lifePath=reduce((dob.replace(/-/g,"").split("").reduce((a,b)=>a+ +b,0)));
  const nameNum=reduce([...name.toUpperCase()].filter(c=>c>="A"&&c<="Z").reduce((a,c)=>a+((c.charCodeAt(0)-65)%9)+1,0))||1;
  const lucky=lifePath===nameNum?lifePath:`${lifePath} & ${nameNum}`;

  const [cName,cHex]=pick(r,COLOURS[el]);
  const place=pick(r,PLACES[mood]);

  const set=(id,t)=>document.getElementById(id).textContent=t;
  set("rSign",sign+" • Born at "+slot);
  set("rHello",`Dear ${name}, you carry the gift of ${strength}. Your birth time gives you ${slotGift}.`);
  set("rNum",lucky); set("rCol",cName); set("rPlace",place);
  document.getElementById("rSw").style.background=cHex;
  set("rFuture",pick(r,FUTURE));
  set("rCareer",pick(r,CAREER));
  set("rLove",pick(r,LOVE));
  set("rMood",MOOD_ADVICE[mood]);

  const res=document.getElementById("result");
  res.style.display="block";res.classList.remove("show");void res.offsetWidth;res.classList.add("show");
  res.scrollIntoView({behavior:"smooth"});
});

// Install button (PWA)
let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").style.display="block"});
document.getElementById("install").addEventListener("click",async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById("install").style.display="none"});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
